server {
    listen 80;
    server_name rafaelcl.com www.rafaelcl.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://rafaelcl.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.rafaelcl.com;
    ssl_certificate /etc/letsencrypt/live/rafaelcl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rafaelcl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://rafaelcl.com$request_uri;
}
server {
    listen 443 ssl;
    server_name rafaelcl.com;
    root /var/www/portfolio/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/rafaelcl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rafaelcl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
    location ~ /\. { deny all; }
    location ~ ^/(SHA256SUMS|release\.json)$ { deny all; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location /resume/ { expires -1; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
